<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Console Blocker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: calc(100vh - 80px);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .feature-list {
            list-style: none;
            padding: 0;
        }

        .feature-list li {
            background: rgba(255, 255, 255, 0.1);
            margin: 10px 0;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🛡️ Enhanced Console Blocker</h1>
        <p>이 페이지는 향상된 개발자 도구 차단 기능을 사용합니다.</p>

        <h2>차단되는 기능들:</h2>
        <ul class="feature-list">
            <li>🚫 키보드 단축키 (F12, Ctrl+Shift+I, Ctrl+Shift+C, etc.)</li>
            <li>🚫 우클릭 컨텍스트 메뉴</li>
            <li>🚫 텍스트 선택</li>
            <li>🚫 개발자 도구 실시간 감지</li>
            <li>🚫 다중 감지 방법으로 우회 방지</li>
        </ul>

        <p><strong>참고:</strong> 이러한 차단 방법들은 완벽하지 않으며, 숙련된 개발자는 여전히 우회할 수 있습니다.</p>
    </div>

    <script src="js/ui.js"></script>
    <script src="js/blocker.js"></script>

    <!-- Additional CSS to prevent some bypass methods -->
    <style>
        /* Prevent highlighting */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* Prevent dragging */
        * {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
        }

        /* Hide scrollbars to prevent some detection methods */
        ::-webkit-scrollbar {
            display: none;
        }

        /* Prevent some dev tools styling */
        * {
            outline: none !important;
        }
    </style>

</body>

</html>
