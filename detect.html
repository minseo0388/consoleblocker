<script>
    // Enhanced multi-method developer tools detector
    (function() {
        'use strict';
        
        let devToolsOpen = false;
        let detectionAttempts = 0;
        const maxAttempts = 3;
        const detectionInterval = 1500; // Increased for better performance
        
        // Method 1: Debugger timing detection
        function detectByTiming() {
            const threshold = 100;
            const start = performance.now();
            debugger;
            const end = performance.now();
            return (end - start) > threshold;
        }
        
        // Method 2: Console object property access detection
        function detectByConsole() {
            let detected = false;
            const image = new Image();
            
            // Define property getter that triggers on dev tools access
            Object.defineProperty(image, 'id', {
                get: function() {
                    detected = true;
                    return 'detected';
                }
            });
            
            try {
                console.log('%c', image);
                console.clear();
            } catch (e) {
                // Ignore errors
            }
            
            return detected;
        }
        
        // Method 3: Enhanced debugger function detection
        function detectByDebuggerFunction() {
            const threshold = 100;
            const debugFunc = new Function('debugger');
            const start = performance.now();
            
            try {
                debugFunc();
            } catch (e) {
                return false;
            }
            
            const end = performance.now();
            return (end - start) > threshold;
        }
        
        // Method 4: Window size detection (imperfect but helpful)
        function detectByWindowSize() {
            const widthThreshold = window.outerWidth - window.innerWidth > 160;
            const heightThreshold = window.outerHeight - window.innerHeight > 160;
            return widthThreshold || heightThreshold;
        }
        
        // Method 5: Console log redirection detection
        function detectByConsoleRedirect() {
            let detected = false;
            const originalLog = console.log;
            
            try {
                console.log = function() {
                    detected = true;
                    originalLog.apply(console, arguments);
                };
                
                console.log('');
                console.log = originalLog; // Restore original
            } catch (e) {
                console.log = originalLog;
            }
            
            return detected;
        }
        
        // Method 6: Element inspection detection
        function detectByElementInspection() {
            let detected = false;
            const element = document.createElement('div');
            element.style.display = 'none';
            
            Object.defineProperty(element, 'innerHTML', {
                get: function() {
                    detected = true;
                    return '';
                },
                set: function() {
                    detected = true;
                }
            });
            
            try {
                document.body.appendChild(element);
                // Trigger potential inspection
                element.innerHTML;
                document.body.removeChild(element);
            } catch (e) {
                // Ignore errors
            }
            
            return detected;
        }
        
        // Method 7: Network monitoring detection
        function detectByNetworkMonitoring() {
            let detected = false;
            
            try {
                const xhr = new XMLHttpRequest();
                const originalOpen = xhr.open;
                
                xhr.open = function() {
                    detected = true;
                    originalOpen.apply(this, arguments);
                };
                
                // Test if monitoring is active
                xhr.open('GET', '#', true);
            } catch (e) {
                // Ignore errors
            }
            
            return detected;
        }
        
        // Method 8: Source code access detection
        function detectBySourceAccess() {
            let detected = false;
            
            try {
                const script = document.createElement('script');
                Object.defineProperty(script, 'src', {
                    get: function() {
                        detected = true;
                        return '';
                    }
                });
                
                // Trigger potential source access
                script.src;
            } catch (e) {
                // Ignore errors
            }
            
            return detected;
        }
        
        // Main detection function
        function detectDevTools() {
            try {
                const methods = [
                    detectByTiming,
                    detectByConsole,
                    detectByDebuggerFunction,
                    detectByWindowSize,
                    detectByConsoleRedirect,
                    detectByElementInspection,
                    detectByNetworkMonitoring,
                    detectBySourceAccess
                ];
                
                let detectedCount = 0;
                const methodResults = {};
                
                methods.forEach((method, index) => {
                    try {
                        const result = method();
                        methodResults[method.name] = result;
                        if (result) {
                            detectedCount++;
                        }
                    } catch (e) {
                        // Ignore individual method errors
                        methodResults[method.name] = false;
                    }
                });
                
                // Log detection results for debugging (remove in production)
                if (window.location.search.includes('debug=true')) {
                    console.log('Detection results:', methodResults);
                }
                
                // Require multiple methods to agree (reduces false positives)
                const isDetected = detectedCount >= 3; // Increased threshold with more methods
                
                if (isDetected && !devToolsOpen) {
                    detectionAttempts++;
                    
                    if (detectionAttempts >= maxAttempts) {
                        devToolsOpen = true;
                        handleDetection(methodResults);
                    }
                } else if (!isDetected) {
                    // Reset if dev tools seem closed
                    detectionAttempts = Math.max(0, detectionAttempts - 1);
                    if (detectionAttempts === 0) {
                        devToolsOpen = false;
                    }
                }
            } catch (e) {
                // Fail silently to avoid breaking the page
            }
        }
        
        function handleDetection(methodResults = {}) {
            const detectedMethods = Object.keys(methodResults).filter(key => methodResults[key]);
            
            // Enhanced alert with more information
            let message = '🚫 개발자 도구가 감지되었습니다!\n';
            message += `감지된 방법: ${detectedMethods.length}개\n`;
            message += '보안을 위해 페이지 접근이 제한됩니다.';
            
            alert(message);
            
            // Optional additional actions:
            // Blur page content
            document.body.style.filter = 'blur(10px)';
            document.body.style.pointerEvents = 'none';
            
            // Show warning overlay
            showWarningOverlay();
            
            // Optional: redirect after delay
            setTimeout(() => {
                // window.location.href = 'about:blank';
                // window.close();
            }, 3000);
        }
        
        // Create warning overlay
        function showWarningOverlay() {
            const overlay = document.createElement('div');
            overlay.id = 'dev-tools-warning';
            overlay.innerHTML = `
                <div style="
                    position: fixed;
                    top: 0;
                    left: 0;
                    width: 100%;
                    height: 100%;
                    background: rgba(0, 0, 0, 0.9);
                    color: white;
                    display: flex;
                    justify-content: center;
                    align-items: center;
                    z-index: 999999;
                    font-family: Arial, sans-serif;
                    text-align: center;
                ">
                    <div>
                        <h1 style="color: #ff4444; margin-bottom: 20px;">⚠️ 접근 차단됨</h1>
                        <p style="font-size: 18px; margin-bottom: 10px;">개발자 도구가 감지되었습니다.</p>
                        <p style="font-size: 14px; opacity: 0.8;">보안을 위해 페이지 접근이 제한됩니다.</p>
                        <p style="font-size: 12px; margin-top: 20px; opacity: 0.6;">
                            이 페이지를 정상적으로 이용하려면 개발자 도구를 닫아주세요.
                        </p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(overlay);
        }
        
        // Throttled detection to avoid performance issues
        let lastCheck = 0;
        function throttledDetection() {
            const now = Date.now();
            if (now - lastCheck > 500) {
                lastCheck = now;
                detectDevTools();
            }
        }
        
        // Initialize detection
        function initializeDetection() {
            // Check if user agent suggests dev tools or debugging
            checkSuspiciousEnvironment();
            
            // Initial check
            setTimeout(detectDevTools, 1000);
            
            // Periodic checks
            setInterval(detectDevTools, detectionInterval);
            
            // Event-based checks (throttled)
            const events = ['resize', 'focus', 'blur', 'beforeunload'];
            events.forEach(event => {
                window.addEventListener(event, throttledDetection, { passive: true });
            });
            
            // Additional protection measures
            setupAdditionalProtections();
        }
        
        // Check for suspicious environment indicators
        function checkSuspiciousEnvironment() {
            const userAgent = navigator.userAgent.toLowerCase();
            const suspiciousIndicators = [
                'headless', 'phantom', 'selenium', 'webdriver'
            ];
            
            const isSuspicious = suspiciousIndicators.some(indicator => 
                userAgent.includes(indicator)
            );
            
            if (isSuspicious) {
                handleDetection({ 'suspiciousEnvironment': true });
            }
        }
        
        // Setup additional protection measures
        function setupAdditionalProtections() {
            // Disable common bypass methods
            try {
                // Disable eval
                window.eval = function() {
                    throw new Error('eval is disabled');
                };
                
                // Monitor console methods
                const consoleMethods = ['log', 'warn', 'error', 'info', 'debug'];
                consoleMethods.forEach(method => {
                    const original = console[method];
                    console[method] = function() {
                        // Allow console in debug mode
                        if (!window.location.search.includes('debug=true')) {
                            detectDevTools();
                        }
                        return original.apply(console, arguments);
                    };
                });
                
                // Disable common debugging functions
                window.debugger = undefined;
                
            } catch (e) {
                // Ignore errors
            }
        }
        
        // Start detection when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeDetection);
        } else {
            initializeDetection();
        }
        
    })();
</script>
